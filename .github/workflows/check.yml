name: Check
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w @markreel/api run db:generate
      - run: npm test
      - run: npx tsc -p apps/api/tsconfig.json --noEmit
      - run: npm -w @markreel/web run build
